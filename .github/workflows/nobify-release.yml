name: Nobify Release

# Builds the desktop companion executables (Windows/macOS/Linux, native per-OS
# via Node SEA), compiles the ESP32-S3 firmware, produces a merged factory image
# for the browser web-flasher, and publishes everything (with OTA manifests) to a
# GitHub Release.
#
# Trigger by pushing a tag like `nobify-v1.1.0`, or run manually with a version.

on:
  push:
    tags: ['nobify-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.1.0'
        required: true

permissions:
  contents: write

jobs:
  # ---- Resolve the version once, share with all jobs --------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#nobify-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building Nobify v$V"

  # ---- Desktop companion executables (native build per OS) --------------------
  companion:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: nobify-companion-win.exe
          - os: macos-latest
            artifact: nobify-companion-macos
          - os: ubuntu-latest
            artifact: nobify-companion-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build companion binary
        working-directory: nobify/companion
        run: |
          npm install --no-audit --no-fund
          npm run build:bin
      - name: Upload companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: nobify/companion/dist/${{ matrix.artifact }}
          if-no-files-found: error

  # ---- Firmware image + factory (web-flasher) image + OTA manifests -----------
  firmware:
    needs: version
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('nobify/firmware/platformio.ini') }}
      - name: Install PlatformIO + esptool
        run: pip install --upgrade platformio esptool
      - name: Server deps + firmware header
        working-directory: nobify/server
        run: npm install --no-audit --no-fund && npm run gen:firmware
      - name: Compile firmware
        working-directory: nobify/firmware
        run: pio run
      - name: Stage firmware, factory image + manifests
        run: |
          set -e
          mkdir -p dist
          BUILD=$(dirname "$(ls nobify/firmware/.pio/build/*/firmware.bin | head -n1)")
          echo "Build dir: $BUILD"
          cp "$BUILD/firmware.bin" "dist/nobify-fw-$VER.bin"

          # Locate the parts needed for a full factory image.
          BOOTLOADER="$BUILD/bootloader.bin"
          PARTITIONS="$BUILD/partitions.bin"
          BOOTAPP0=$(ls ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin | head -n1)
          echo "bootloader=$BOOTLOADER partitions=$PARTITIONS boot_app0=$BOOTAPP0"

          # Merge into a single flashable image (offset 0) for ESP Web Tools.
          python -m esptool --chip esp32s3 merge-bin \
            -o dist/nobify-factory.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0 "$BOOTLOADER" \
            0x8000 "$PARTITIONS" \
            0xe000 "$BOOTAPP0" \
            0x10000 "$BUILD/firmware.bin"

          # OTA manifest (devices poll this).
          node -e "require('fs').writeFileSync('dist/manifest.json', JSON.stringify({version:process.env.VER, bin:'nobify-fw-'+process.env.VER+'.bin', notes:'Nobify firmware '+process.env.VER, mandatory:false, ts:Date.now()}, null, 2))"
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            dist/nobify-fw-*.bin
            dist/nobify-factory.bin
            dist/manifest.json
          if-no-files-found: error

  # ---- Gather everything + publish the Release --------------------------------
  release:
    needs: [version, companion, firmware]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          ls -la dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('nobify-v{0}', env.VER) }}
          name: Nobify v${{ env.VER }}
          generate_release_notes: true
          files: |
            dist/nobify-companion-win.exe
            dist/nobify-companion-macos
            dist/nobify-companion-linux
            dist/nobify-factory.bin
            dist/nobify-fw-${{ env.VER }}.bin
            dist/manifest.json
