name: Deploy Nobify dashboard to GitHub Pages

# Publishes the static dashboard in nobify/webapp to GitHub Pages.
# Enable: repo Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main-Ionity, main]
    paths:
      - 'nobify/webapp/**'
      - '.github/workflows/nobify-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nobify/webapp
      - id: deployment
        uses: actions/deploy-pages@v4
