name: Nobify CI

on:
  push:
    branches: [main-Ionity, main]
    paths: ['nobify/**', '.github/workflows/nobify-ci.yml']
  pull_request:
    paths: ['nobify/**', '.github/workflows/nobify-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install server deps
        working-directory: nobify/server
        run: npm install --no-audit --no-fund
      - name: Smoke test (REST + WS + OTA)
        working-directory: nobify/server
        run: npm test
      - name: Generate firmware header from YAML
        working-directory: nobify/server
        run: npm run gen:firmware
      - name: Upload generated header
        uses: actions/upload-artifact@v4
        with:
          name: nobify-config-header
          path: nobify/firmware/include/nobify_config.h

  webapp:
    name: Webapp syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check dashboard scripts
        working-directory: nobify/webapp
        run: node --check app.js && node --check config.js && node --check install.js
      - name: Validate HTML files exist
        working-directory: nobify/webapp
        run: test -f index.html && test -f install.html

  companion:
    name: Companion syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check companion
        working-directory: nobify/companion
        run: node --check src/index.js && node --check src/config.js && node --check src/notify.js && node --check src/tray.js

  firmware:
    name: Firmware build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('nobify/firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Generate firmware header from YAML
        working-directory: nobify/server
        run: npm install --no-audit --no-fund && npm run gen:firmware
      - name: Compile firmware
        working-directory: nobify/firmware
        run: pio run
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: nobify-firmware-bin
          path: nobify/firmware/.pio/build/*/firmware.bin
          if-no-files-found: warn
