<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nobify">
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e90ff"/>
      <stop offset="0.5" stop-color="#12d6a6"/>
      <stop offset="1" stop-color="#ff8c00"/>
    </linearGradient>
    <radialGradient id="nbGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#12d6a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#12d6a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded app tile -->
  <rect width="512" height="512" rx="112" fill="#0a0e1a"/>
  <rect x="6" y="6" width="500" height="500" rx="107" fill="none" stroke="#1b2540" stroke-width="4"/>
  <circle cx="256" cy="220" r="150" fill="url(#nbGlow)"/>

  <!-- radar sweep arcs (presence detection) -->
  <g fill="none" stroke="url(#nb)" stroke-linecap="round">
    <path d="M136 300 a120 120 0 0 1 240 0" stroke-width="14" opacity="0.95"/>
    <path d="M170 300 a86 86 0 0 1 172 0" stroke-width="12" opacity="0.6"/>
    <path d="M204 300 a52 52 0 0 1 104 0" stroke-width="10" opacity="0.35"/>
  </g>

  <!-- detected person (dot) -->
  <circle cx="256" cy="300" r="26" fill="url(#nb)"/>

  <!-- baseline -->
  <rect x="136" y="330" width="240" height="10" rx="5" fill="#1b2540"/>
</svg>
