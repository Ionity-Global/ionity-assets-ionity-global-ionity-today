; ============================================================================
;  Nobify — ESP32-S3 (generic N16R8: 16MB flash / 8MB PSRAM)
;  Dual-sensor human presence: 24GHz mmWave (ORANGE LED) + WiFi CSI (BLUE LED)
;
;  Configure the device in nobify.config.yaml, then regenerate the header:
;     cd ../server && npm run gen:firmware
;  Build & flash:
;     pio run -t upload && pio device monitor
; ============================================================================
[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; N16R8: 16MB QIO flash + 8MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=4
    ; --- TFT_eSPI display config (ST7789 240x320). Adjust pins for your board. ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    -DTFT_RST=14
    -DTFT_BL=21
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000

lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    adafruit/Adafruit NeoPixel@^1.12.3
    bodmer/TFT_eSPI@^2.5.43
    jnthas/Improv WiFi Library@^0.0.2
